name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev
        pip3 install --user --upgrade buildozer cython virtualenv
    - name: Build with Buildozer
      run: |
        export PATH=$PATH:~/.local/bin
        echo "[app]" > buildozer.spec
        echo "title = Общежитский повар" >> buildozer.spec
        echo "package.name = cookdorm" >> buildozer.spec
        echo "package.domain = org.cookdorm" >> buildozer.spec
        echo "source.dir = ." >> buildozer.spec
        echo "source.include_exts = py,png,jpg,kv,atlas,json" >> buildozer.spec
        echo "version = 1.0.0" >> buildozer.spec
        echo "requirements = python3,kivy==2.3.0" >> buildozer.spec
        echo "orientation = portrait" >> buildozer.spec
        echo "android.api = 33" >> buildozer.spec
        echo "android.minapi = 24" >> buildozer.spec
        echo "android.archs = arm64-v8a, armeabi-v7a" >> buildozer.spec
        echo "android.ndk = 25b" >> buildozer.spec
        echo "log_level = 2" >> buildozer.spec
        yes | buildozer -v android debug
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: cookdorm-apk
        path: bin/*.apk
